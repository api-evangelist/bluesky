- aid: bluesky:bluesky-jetstream
  name: Bluesky Jetstream
  tags:
  - Event
  - Social Networks
  - Streaming
  tags_raw:
  - Events
  - Social Networks
  - Streaming
  humanURL: https://docs.bsky.app/blog/jetstream
  properties:
  - url: https://docs.bsky.app/blog/jetstream
    type: Documentation
  - url: https://github.com/bluesky-social/jetstream
    type: GitHubRepository
  - url: asyncapi/bluesky-asyncapi.yml
    type: AsyncAPI
  description: >-
    Jetstream is a simplified JSON event stream for the AT Protocol that converts CBOR-encoded MST blocks
    from the firehose into JSON objects over WebSocket connections, making it easier to consume real-time
    Bluesky network events for building feed generators, bots, and search engines.
